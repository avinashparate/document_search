version: "3.9"
services:
  api:
    build: .
    ports:
      - "5000:8080"
    depends_on:
      - postgres
      - elasticsearch
      - redis

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: documents
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"

  elasticsearch:
    image: elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"

  redis:
    image: redis:7
    ports:
      - "6379:6379"
